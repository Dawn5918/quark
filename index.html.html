<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>夸克</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;}
body{
  background: linear-gradient(135deg,#f0f4ff,#f7f8fa);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}
.card{
  background:#ffffff;
  border-radius:20px;
  padding:40px 30px;
  max-width:440px;
  width:100%;
  box-shadow: 0 8px 30px rgba(37, 99, 235,0.08);
  text-align:center;
}
.icon{
  width:56px;
  height:56px;
  margin:0 auto 16px;
  border-radius:16px;
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 6px 16px rgba(59,130,246,.25);
}
.icon::before{
  content:"Q";
  color:#fff;
  font-size:28px;
  font-weight:800;
  letter-spacing:1px;
}
h2{
  color:#1f2937;
  font-size:24px;
  margin-bottom:12px;
}
.desc{
  color:#6b7280;
  font-size:15px;
  line-height:1.6;
  margin-bottom:32px;
}
.btn-primary{
  display:block;
  width:100%;
  background:#2563eb;
  color:#fff;
  text-decoration:none;
  padding:16px;
  border-radius:12px;
  font-size:16px;
  font-weight:500;
  border:none;
  cursor:pointer;
  transition:.2s;
  margin-bottom:14px;
}
.btn-primary:hover{
  background:#1d4ed8;
}
.btn-copy{
  display:block;
  width:100%;
  background:#eff6ff;
  color:#2563eb;
  padding:16px;
  border-radius:12px;
  font-size:16px;
  font-weight:500;
  border:none;
  cursor:pointer;
  transition:.2s;
}
.btn-copy:hover{
  background:#dbeafe;
}
</style>
</head>
<body>
<div class="card">
  <div class="icon"></div>
  <h2>夸克</h2>
  <p class="desc">复制下方链接，打开夸克App即可查看完整资源</p>
  <div id="container"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const targetUrl = params.get('url');
const container = document.getElementById('container');
if(targetUrl){
  container.innerHTML = `
    <a class="btn-primary" href="${targetUrl}" target="_blank">打开夸克</a>
    <button class="btn-copy" onclick="copyLink(this)">复制网盘链接</button>
  `;
}else{
  container.innerHTML = `<p style="color:#ef4444">链接参数缺失，请检查网址</p>`;
}
function copyLink(btn){
  navigator.clipboard.writeText(targetUrl);
  btn.innerText = "✅ 链接已复制";
  setTimeout(()=>{btn.innerText="复制网盘链接"},2000);
}
</script>
</body>
</html>
