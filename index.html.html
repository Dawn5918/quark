<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源页面</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#f7f8fa;padding:40px 20px;text-align:center}
.box{background:#fff;border-radius:16px;padding:32px;max-width:420px;margin:0 auto;box-shadow:0 2px 12px #00000010}
.tip{color:#666;margin:16px 0 24px;font-size:15px}
.btn{display:block;text-decoration:none;background:#2563eb;color:#fff;padding:14px;border-radius:10px;font-size:16px;margin:12px 0}
.btn-copy{background:#eee;color:#222}
</style>
</head>
<body>
<div class="box">
  <h2>资源获取</h2>
  <p class="tip">请复制链接，打开夸克APP查看</p>
  <div id="showUrl"></div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
const targetUrl = params.get('url');
const box = document.getElementById('showUrl');
if(targetUrl){
  box.innerHTML = `
    <a class="btn" href="${targetUrl}" target="_blank">打开夸克资源</a>
    <button class="btn btn-copy" onclick="navigator.clipboard.writeText('${targetUrl}');this.innerText='✅已复制'">复制夸克链接</button>
  `;
}else{
  box.innerText = "链接参数缺失，请检查网址";
}
</script>
</body>
</html>
